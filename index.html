<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Signal — Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Auth Screen (shown when signed out) ===== -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">signal</span>
    </div>
    <p class="auth-tagline">sign in to post, like, and stay caught up</p>

    <div class="auth-tabs">
      <button class="auth-tab is-active" data-tab="login" type="button">Log in</button>
      <button class="auth-tab" data-tab="signup" type="button">Sign up</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" required>
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="auth-submit">Log in</button>
      <p class="auth-error" id="loginError"></p>
    </form>

    <form id="signupForm" class="auth-form" style="display:none">
      <input type="text" id="signupName" placeholder="Display name" autocomplete="name" required>
      <input type="email" id="signupEmail" placeholder="Email" autocomplete="email" required>
      <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" autocomplete="new-password" minlength="6" required>
      <button type="submit" class="auth-submit">Create account</button>
      <p class="auth-error" id="signupError"></p>
    </form>
  </div>
</div>

<div class="app">

  <!-- ===== Top Bar ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">signal</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="searchToggle" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="bellBtn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3a5 5 0 0 0-5 5v3.2c0 .6-.24 1.18-.66 1.6L5 14.2c-.9.9-.26 2.44 1 2.44h12c1.26 0 1.9-1.53 1-2.44l-1.34-1.4a2.27 2.27 0 0 1-.66-1.6V8a5 5 0 0 0-5-5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="badge">3</span>
      </button>
    </div>
  </header>

  <!-- ===== Search Bar (hidden by default) ===== -->
  <div class="searchbar" id="searchBar">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="Find people or posts">
  </div>

  <main class="feed" id="feed">

    <!-- ===== Stories ===== -->
    <section class="stories" aria-label="Stories">
      <div class="story story--self" data-name="You">
        <div class="story-ring story-ring--add">
          <div class="story-avatar" style="background:linear-gradient(135deg,#3a3b44,#22232a)">＋</div>
        </div>
        <span class="story-label">Your story</span>
      </div>

      <div class="story" data-name="Mira" data-live="true">
        <div class="story-ring">
          <div class="story-avatar" style="background:linear-gradient(135deg,#D8FF5E,#8B7CFF)">M</div>
        </div>
        <span class="story-label">mira</span>
      </div>

      <div class="story" data-name="Kenji">
        <div class="story-ring">
          <div class="story-avatar" style="background:linear-gradient(135deg,#FF9F6E,#FF5D73)">K</div>
        </div>
        <span class="story-label">kenji</span>
      </div>

      <div class="story" data-name="Priya" data-live="true">
        <div class="story-ring">
          <div class="story-avatar" style="background:linear-gradient(135deg,#5ED8FF,#8B7CFF)">P</div>
        </div>
        <span class="story-label">priya</span>
      </div>

      <div class="story" data-name="Owen">
        <div class="story-ring">
          <div class="story-avatar" style="background:linear-gradient(135deg,#FFD86E,#FF9F6E)">O</div>
        </div>
        <span class="story-label">owen</span>
      </div>

      <div class="story" data-name="Lulu">
        <div class="story-ring">
          <div class="story-avatar" style="background:linear-gradient(135deg,#8B7CFF,#D8FF5E)">L</div>
        </div>
        <span class="story-label">lulu</span>
      </div>
    </section>

    <div class="waveform-divider" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- ===== Posts (loaded live from Firestore) ===== -->
    <section class="post-list" id="postList"></section>

    <p class="empty-state" id="emptyState" style="display:none;">no posts yet — be the first ✦</p>
    <p class="end-of-feed" id="endOfFeed" style="display:none;">you're all caught up ✦</p>
  </main>

  <!-- ===== Bottom Nav ===== -->
  <nav class="bottomnav" aria-label="Primary">
    <button class="nav-btn is-active" data-view="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-btn" data-view="search" aria-label="Explore">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="nav-btn nav-create" id="composeBtn" aria-label="Create post">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="nav-btn" data-view="activity" aria-label="Activity">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 20.5s-7.5-4.6-10-9.3C.6 8 2 4.3 5.7 3.6 8.2 3.1 10.4 4.4 12 6.7c1.6-2.3 3.8-3.6 6.3-3.1 3.7.7 5.1 4.4 3.7 7.6-2.5 4.7-10 9.3-10 9.3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-btn nav-profile" id="profileBtn" aria-label="Account">
      <span class="nav-avatar" id="navAvatar">Y</span>
    </button>
  </nav>

</div>

<!-- ===== Compose Modal ===== -->
<div class="modal-overlay" id="composeOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <button class="text-btn" id="composeCancel">Cancel</button>
      <span class="modal-title">New post</span>
      <button class="text-btn text-btn--accent" id="composeSubmit" disabled>Post</button>
    </div>
    <div class="modal-body">
      <div class="post-avatar" style="background:linear-gradient(135deg,#D8FF5E,#8B7CFF)">Y</div>
      <textarea id="composeText" placeholder="What's pulsing through your mind?" maxlength="240" rows="4"></textarea>
    </div>
    <div class="modal-foot">
      <span id="charCount">0 / 240</span>
    </div>
  </div>
</div>

<!-- ===== Story Viewer ===== -->
<div class="story-viewer" id="storyViewer">
  <div class="story-progress"><span id="storyProgressBar"></span></div>
  <div class="story-viewer-head">
    <div class="story-viewer-avatar" id="viewerAvatar"></div>
    <span id="viewerName"></span>
    <button class="story-close" id="storyClose" aria-label="Close story">✕</button>
  </div>
  <div class="story-viewer-body" id="viewerBody"></div>
</div>

<!-- ===== Account Panel ===== -->
<div class="modal-overlay" id="accountOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <span class="modal-title">Account</span>
      <button class="text-btn" id="accountClose">Close</button>
    </div>
    <div class="account-body">
      <div class="post-avatar" id="accountAvatar" style="background:linear-gradient(135deg,#D8FF5E,#8B7CFF)">Y</div>
      <div class="account-info">
        <span class="post-name" id="accountName">—</span>
        <span class="post-time" id="accountEmail">—</span>
      </div>
    </div>
    <button class="auth-submit auth-submit--danger" id="logoutBtn">Log out</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase (compat build — works with plain script tags, no build tool needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
